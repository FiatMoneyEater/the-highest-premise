name: Publish GitHub Pages & Ping IndexNow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit Sitemap URLs to IndexNow (Bing, DuckDuckGo, Yandex, Naver)
        continue-on-error: true
        run: |
          python3 - << 'EOF'
          import json, re, urllib.request
          from pathlib import Path
          xml = Path("sitemap.xml").read_text(encoding="utf-8")
          urls = re.findall(r"<loc>(.*?)</loc>", xml)
          payload = {
              "host": "fiatmoneyeater.github.io",
              "key": "20372d4b9f8e4c1a8b7d6e5f4a3b2c1d",
              "keyLocation": "https://fiatmoneyeater.github.io/the-highest-premise/20372d4b9f8e4c1a8b7d6e5f4a3b2c1d.txt",
              "urlList": urls
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("IndexNow status:", resp.status)
          EOF
